        instancedMesh.getMatrixAt(i, testMatrix);
        testVector.setFromMatrixPosition(testMatrix);

        let dx = testVector.x - worldCam.x;
        let dy = testVector.y - worldCam.y;
        let dz = testVector.z - worldCam.z;

        let updated = false;

        if (dx > halfWrap) {
            testVector.x -= wrap;
            updated = true;
        }
        else if (dx < -halfWrap) {
            testVector.x += wrap;
            updated = true;
        }

            updated = true;
        }
        else if (dy < -halfWrap) {
            testVector.y += wrap;
            updated = true;
        }

        if (dz > halfWrap) {

            tubes[i].scale.x+=1.5
            tubes[i].scale.y+=1.5
            shakeMuch()
            //tubes[i].scale.z+=0.1
            if(tubes[i].scale.x>=15){
                scene.remove(tubes[i])
                tubes.splice(i, 1)
            }
        }
    }
    function shakeMuch(){
        can.style.top = -Math.random()*(7*effect)+"px"
        can.style.left = -Math.random()*(7*effect)+"px"
    }
    function shake(){
        can.style.top = -Math.random()*(3*effect)+"px"
        can.style.left = -Math.random()*(3*effect)+"px"
    }
    out.addEventListener("pointerdown", function(e){
        let newX = parseInt(prompt("Where X?", 0))
        let newY = parseInt(prompt("Where Y?", 0))
        let newZ = parseInt(prompt("Where Z?", 0))
        player.position.set(newX, newY, newZ)
    });
    document.addEventListener("keydown", function (e) {
        
        
        
        
        if(e.key ==" "){
            motor=!motor
            console.log(colliderA.length)
             console.log(destroyedDict)
        }
        
        if(e.shiftKey||e.key=="m"){
            shaking=0
           let obj = new THREE.Mesh(fireG, fireM)
            obj.position.copy(player.position)  
            obj.maker = "self"

      
            obj.rotation.copy(player.rotation) 

            fires.push(obj)
            scene.add(obj)
        }
        
        renderer.render(scene, camera);
    });
    const weiter = new THREE.Vector3(0, 0, -1);
const pitch = new THREE.Vector3(1, 0, 0);
const roll = new THREE.Vector3(0, 0, 1);
let lastTime = 0;
let counter =0;
let shaking = 20;
function animate(a) {
    requestAnimationFrame(animate);
    updateFires()
    updateTubes()
    shaking++;
    if(shaking<=20)shake()
    let start1 = performance.now()
    let elapsed = a - lastTime;
    
    if (elapsed >= 16) {
        lastTime = a - (elapsed % 16);
    }else{
        return;
    }
    testMesh.position.set(player.position.x, player.position.y, player.position.z)
    counter++
    counter%=5
    if(counter==0)makeInfinite();
    const halfWidth = window.innerWidth / 2;
    const halfHeight = window.innerHeight / 2;

    const relX = (X - halfWidth) / halfWidth;
    const relY = (Y - halfHeight) / halfHeight;
    //if(Math.round(camera.position.x)%size==0||Math.round(camera.position.y)%size==0||Math.round(camera.position.z)%size==0)makeInfinite()
    if (motor) {
        player.rotateOnAxis(
            pitch,
            relY * 0.04
        );

        
        player.rotateOnAxis(
            roll,
            -relX * 0.04
        );
    }

    
    weiter.set(0, 0, -1);
    
    weiter.applyQuaternion(player.quaternion);

    
    if (motor) {
        movement.addScaledVector(weiter, 4 / scale);
    }

    
    if (shaking > 0 && shaking <= 5) {
    
        movement.addScaledVector(weiter, -(4 / scale) * 2);
    }

    
    movement.multiplyScalar(0.98);
    player.position.add(movement);
    
    renderer.render(scene, camera);
    let end = performance.now()
    fps = 1000/(end-start1)
    out.innerHTML = "FPS:"+Math.round(fps)+"<br>X: "+Math.round(player.position.x)+" Y: "+Math.round(player.position.y)+" Z: "+Math.round(player.position.z)
}

animate();
