                                player.position.z + Math.random() * see * size - (see * size) / 2
                            );

                        } else if (rand == 5) {
                            ships[i].position.set(
                                player.position.x + Math.random() * see * size - (see * size) / 2,
                                -(player.position.y + see * size / 2),
                                player.position.z + Math.random() * see * size - (see * size) / 2
                            );

                        } else {
                            ships[i].position.set(
                                player.position.x + Math.random() * see * size - (see * size) / 2,
                                player.position.y + Math.random() * see * size - (see * size) / 2,
                                -(player.position.z + see * size / 2)
                            );
                        }

                        continue;

                    } else if (xtest && ytest && ztest&&fires[j].maker!=i) {
                        ships[i].age++
                        fires[j].age = 50
                    }
                }
                if (ships[i].goal == "self") {
                    ships[i].lookAt(player.position)
                }else{
                    ships[i].lookAt(ships[ships[i].goal].position)
                }
                ships[i].rotateY(Math.PI)
                if (Math.random() >= 0.98) {
                    let obj = new THREE.Mesh(fireG, fireM)
                    obj.position.copy(ships[i].position)
                    obj.rotation.copy(ships[i].rotation)
                    obj.maker = i


                    

                    fires.push(obj)
                    scene.add(obj)
                    playAudio(player.position.distanceTo(ships[i].position)*12)

                }
                ships[i].translateZ(-0.9);
                if (ungefaer(player.position.x, ships[i].position.x, see * size) && ungefaer(player.position.y, ships[i].position.y, see * size) && ungefaer(player.position.z, ships[i].position.z, see * size)) {

                } else {

                    let rand = Math.round(Math.random() * 5 + 1)
                    if (rand == 1) {
                        ships[i].position.set(
                            player.position.x + see * size / 2,
                            player.position.y + Math.random() * see * size - (see * size) / 2,
                            player.position.z + Math.random() * see * size - (see * size) / 2
                        );

                    } else if (rand == 2) {
                        ships[i].position.set(
                            player.position.x + Math.random() * see * size - (see * size) / 2,
                            player.position.y + see * size / 2,
                            player.position.z + Math.random() * see * size - (see * size) / 2
                        );

                    } else if (rand == 3) {
                        ships[i].position.set(
                            player.position.x + Math.random() * see * size - (see * size) / 2,
                            player.position.y + Math.random() * see * size - (see * size) / 2,
                            player.position.z + see * size / 2
                        );
                    } else if (rand == 4) {
                        ships[i].position.set(
                            -(player.position.x + see * size / 2),
                            player.position.y + Math.random() * see * size - (see * size) / 2,
                            player.position.z + Math.random() * see * size - (see * size) / 2
                        );

                    } else if (rand == 5) {
                        ships[i].position.set(
                            player.position.x + Math.random() * see * size - (see * size) / 2,
                            -(player.position.y + see * size / 2),
                            player.position.z + Math.random() * see * size - (see * size) / 2
                        );

                    } else {
                        ships[i].position.set(
                            player.position.x + Math.random() * see * size - (see * size) / 2,
                            player.position.y + Math.random() * see * size - (see * size) / 2,
                            -(player.position.z + see * size / 2)
                        );
                    }
                }
            }
        }
        function updateFires() {
            for (let i = fires.length - 1; i >= 0; i--) {
                fires[i].translateZ(-5);
                let colliding = collidesAt(fires[i].position)
                if (colliding) {
                    if (destroyedDict[colliding] != undefined) {
                        destroyedDict[colliding] += 1
                    } else {
                        destroyedA.push(colliding)
                        destroyedDict[colliding] = 0
                    }
                    if (destroyedDict[colliding] == 3) {
                        let mesh1 = new THREE.Mesh(torus, torusM)
                        mesh1.position.set(colliding[0], colliding[1], colliding[2])
                        scene.add(mesh1)
                        tubes.push(mesh1)
                    }


                    fires[i].age = 51
                }
                if (fires[i].age == undefined) fires[i].age = 0
                fires[i].age += 0.4
                if (fires[i].age >= 50) {
                    scene.remove(fires[i])
                    fires.splice(i, 1)
                }
            }

        }
        function updateTubes() {
            for (let i = tubes.length - 1; i >= 0; i--) {
                tubes[i].scale.x += 1.5
                tubes[i].scale.y += 1.5
                shakeMuch()
                //tubes[i].scale.z+=0.1
                if (tubes[i].scale.x >= 15) {
                    scene.remove(tubes[i])
                    tubes.splice(i, 1)
                }
            }
        }
        function shakeMuch() {
            can.style.top = -Math.random() * (7 * effect) + "px"
            can.style.left = -Math.random() * (7 * effect) + "px"
        }
        function shake() {
            can.style.top = -Math.random() * (3 * effect) + "px"
            can.style.left = -Math.random() * (3 * effect) + "px"
        }
        out.addEventListener("pointerdown", function (e) {
            let newX = parseInt(prompt("Where X?", 0))
            let newY = parseInt(prompt("Where Y?", 0))
            let newZ = parseInt(prompt("Where Z?", 0))
            player.position.set(newX, newY, newZ)
        });
        document.addEventListener("keydown", function (e) {




            if (e.key == " ") {
                motor = !motor
                console.log(colliderA.length)
                console.log(destroyedDict)
            }

            if (e.shiftKey || e.key == "m") {
                shaking = 0
                let obj = new THREE.Mesh(fireG, fireM)
                obj.position.copy(player.position)
                obj.maker = "self"


                obj.rotation.copy(player.rotation)

                fires.push(obj)
                scene.add(obj)
                
            playAudio()
            }

            renderer.render(scene, camera);
        });
        const weiter = new THREE.Vector3(0, 0, -1);
        const pitch = new THREE.Vector3(1, 0, 0);
        const roll = new THREE.Vector3(0, 0, 1);
        let lastTime = 0;
        let counter = 0;
        let shaking = 20;
        function animate(a) {
            requestAnimationFrame(animate);
            updateFires()
            updateTubes()
            shaking++;
            if (shaking <= 20) shake()
            let start1 = performance.now()
            let elapsed = a - lastTime;

            if (elapsed >= 16) {
                lastTime = a - (elapsed % 16);
            } else {
                return;
            }
            updateShips()
            testMesh.position.set(player.position.x, player.position.y, player.position.z)
            counter++
            counter %= 5
            if (counter == 0) makeInfinite();
            const halfWidth = window.innerWidth / 2;
            const halfHeight = window.innerHeight / 2;

            const relX = (X - halfWidth) / halfWidth;
            const relY = (Y - halfHeight) / halfHeight;
            //if(Math.round(camera.position.x)%size==0||Math.round(camera.position.y)%size==0||Math.round(camera.position.z)%size==0)makeInfinite()
            if (motor) {
                player.rotateOnAxis(
                    pitch,
                    relY * 0.04 / speed
                );


                player.rotateOnAxis(
                    roll,
                    -relX * 0.04 / speed
                );
            }


            weiter.set(0, 0, -1);

            weiter.applyQuaternion(player.quaternion);


            if (motor) {
                movement.addScaledVector(weiter, 4 / scale / speed);
            }


            if (shaking > 0 && shaking <= 5) {

                movement.addScaledVector(weiter, -(4 / scale) * 2);
            }


            movement.multiplyScalar(0.98);
            player.position.add(movement);

            renderer.render(scene, camera);
            let end = performance.now()
            fps = 1000 / (end - start1)
            out.innerHTML = "FPS:" + Math.round(fps) + "<br>X: " + Math.round(player.position.x) + " Y: " + Math.round(player.position.y) + " Z: " + Math.round(player.position.z)
        }

        animate();
        //animate()
        document.addEventListener("pointermove", function (e) {
            X = e.clientX;
            Y = e.clientY;
            /*let width = window.innerWidth/2
            let height = window.innerHeight/2
            if(Y>=height){
                
            }*/
            if (!motor && drag) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;

            }

        });

        document.addEventListener("pointerdown", function (e) {
            interact =true
            drag = true
            if (true) {
                shaking = 0
                let obj = new THREE.Mesh(fireG, fireM)
                obj.position.copy(player.position)
                obj.maker = "self"


                obj.rotation.copy(player.rotation)

                fires.push(obj)
                scene.add(obj)
                playAudio()
            }



        });






        document.addEventListener("pointerup", function (e) {
            drag = false;
        });


    </script>
